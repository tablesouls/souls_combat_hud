type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="moreoffhandslots"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbteams"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="parcool"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="paraglider"
type="optional"
ordering="AFTER"
