plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = "${mod_id}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "ts_ui_lib" {
            sourceSet(project(':ts_ui_lib').sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        url = "file://${projectDir}/mcmodsrepo"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url = "https://code.redspace.io/releases"
    }
    maven {
        url = "https://maven.ftb.dev/releases"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    maven {
        url = "https://maven.kosmx.dev/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def compatModsRuntime = localProps.getProperty('enableCompatModsRuntime', 'false').toBoolean()

def compatDeps = [
       "io.redspace:irons_spellbooks:${irons_spells_neoforge_version}",
       "io.redspace:irons_lib:${irons_lib_neoforge_version}",
       "dev.architectury:architectury-neoforge:${architectury_neoforge_version}",
       "dev.ftb.mods:ftb-library-neoforge:${ftb_library_neoforge_version}",
       "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_neoforge_version}",
       "curse.maven:more-offhand-slots-1222373:${moreoffhandslots_neoforge_version}",
       "curse.maven:epic-fight-mod-405076:${epicfight_neoforge_version}",
       "curse.maven:thirst-was-reclaimed-884742:${thirst_was_reclaimed_neoforge_version}",
       "curse.maven:paragliders-289240:${paraglider_neoforge_version}",
       "dev.kosmx.player-anim:player-animation-lib-forge:${player_animation_lib_neoforge_version}",
       "top.theillusivec4.curios:curios-neoforge:${curio_neoforge_version}",
       //"curse.maven:mine-and-slash-reloaded-306575:${mine_and_slash_neoforge_version}",
       //"curse.maven:library-of-exile-398780:${library_of_exile_neoforge_version}",
       "curse.maven:legendary-survival-overhaul-840254:${legendarysurvivaloverhaul_neoforge_version}",
       //"curse.maven:mana-and-artifice-406360:${mana_and_artifice_neoforge_version}",
       "curse.maven:ars-nouveau-401955:${ars_nouveau_neoforge_version}"
]

dependencies {
    implementation project(':ts_ui_lib')
    jarJar project(':ts_ui_lib')

    compatDeps.each { dep ->
        compileOnly dep
        if (compatModsRuntime) {
            runtimeOnly dep
        }
    }

    compileOnly "curse.maven:auto-hud-623806:${autohud_neoforge_version}"

    if (compatModsRuntime) {
        runtimeOnly "curse.maven:configured-457570:7276577"
        //runtimeOnly "maven.modrinth:ghrZDhGW:YWasQFNI"
        //runtimeOnly "maven.modrinth:XqqOkvZz:XMYeNIOx"

        //runtimeOnly "curse.maven:epicfight-extra-1434276:7961244"
        runtimeOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_neoforge_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_logo               : mod_logo
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}